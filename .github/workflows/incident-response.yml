name: Incident Response — Detect and Pre-triage

# Two ways in:
#   1. repository_dispatch — a real Azure Monitor alert (via webhook) fires this
#   2. workflow_dispatch    — manual trigger, used for the live conference demo
#      so the "overnight-only" job can be kicked off on stage without waiting
#      for an actual 3am.

on:
  repository_dispatch:
    types: [reconciliation-anomaly]
  workflow_dispatch:
    inputs:
      use_fixture:
        description: "Use the local fixture instead of a live App Insights query"
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

jobs:
  pre-triage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — the pre-triage step needs the recent deploy diff

      - name: Gather context and build the curated issue
        id: gather
        run: |
          ./scripts/pre-triage/gather-context.sh \
            "${{ github.event.client_payload.alert_json || '' }}" \
            "${{ inputs.use_fixture || 'true' }}" \
            > issue-body.md

      - name: Create issue
        id: create-issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('issue-body.md', 'utf8');
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[Incident] Reconciliation job processed zero records',
              body,
              labels: ['incident', 'agent-investigate']
            });
            core.setOutput('issue_number', issue.data.number);

      # Assigning to Copilot is a manual step in GitHub's UI/API today
      # (Settings → Copilot → Coding agent, or the "Assign to Copilot" issue
      # action). This step documents the intent; wire in the actual
      # assignment call once your org's coding agent policy is enabled.
      - name: Note next step
        run: |
          echo "Issue #${{ steps.create-issue.outputs.issue_number }} created."
          echo "Assign it to the Copilot coding agent to start the investigation."
